# Dependabot: keep pinned actions, reusable workflows and Python dev tools
# current; wait 7 days after a release to skip short-lived malicious versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
