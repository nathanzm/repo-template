# CI: the required checks for main. standards.yml in nathanzm/.github detects
# the languages here and runs each one's gates; only `standards / result` is
# required. It runs at @main; that repo holds the pins.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards:
    uses: nathanzm/.github/.github/workflows/standards.yml@main
    # with:
    #   exclude: vendor/   # path prefixes detection ignores (vendored code)
