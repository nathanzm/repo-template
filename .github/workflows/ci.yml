# CI: the required checks for main (baseline gates plus the Python toolchain).
# Reusable workflows come from nathanzm/.github, pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    uses: nathanzm/.github/.github/workflows/baseline.yml@05f8ae06dbc2c29ad433e93ab78e6016455f68cb # v1.0.1
  python:
    uses: nathanzm/.github/.github/workflows/python.yml@05f8ae06dbc2c29ad433e93ab78e6016455f68cb # v1.0.1
