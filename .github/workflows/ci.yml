# CI: the required checks for main (baseline gates plus the Python toolchain).
# Shared workflows come from nathanzm/.github at @main; that repo holds the pins.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    uses: nathanzm/.github/.github/workflows/baseline.yml@main
  python:
    uses: nathanzm/.github/.github/workflows/python.yml@main
