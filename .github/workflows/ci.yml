# CI: the required checks for main (baseline gates plus the Python toolchain).
# Reusable workflows come from nathanzm/.github, pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    uses: nathanzm/.github/.github/workflows/baseline.yml@c0ad97923ddd2fcb750865602de3f50c6dfa6656 # v1.0.0
  python:
    uses: nathanzm/.github/.github/workflows/python.yml@c0ad97923ddd2fcb750865602de3f50c6dfa6656 # v1.0.0
