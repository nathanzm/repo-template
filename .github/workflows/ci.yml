# CI: the required checks for main. The baseline gates run in every repo; add
# one job per language from nathanzm/.github (see its README), for example:
#   python:
#     uses: nathanzm/.github/.github/workflows/python.yml@main
# Shared workflows come from nathanzm/.github at @main; that repo holds the pins.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    uses: nathanzm/.github/.github/workflows/baseline.yml@main
