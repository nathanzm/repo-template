# Project metadata and tool configuration (ruff, mypy, pytest, coverage).
# The coverage floor (100%) is enforced by CI, not here.

[project]
name = "example"
version = "0.1.0"
description = "TODO: one-line description."
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, bandit security rules,
# comprehensions, simplify, ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest uses plain assert.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: uses real external dependencies (files, processes, services)"]

[tool.coverage.run]
source = ["src"]
branch = true
